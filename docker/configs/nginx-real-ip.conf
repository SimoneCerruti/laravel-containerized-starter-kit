# Trusted proxies for the client IP (real_ip_header is set in the server block). Docker networks:
# the reverse proxy in front (Traefik) reaches the container from one of them. Kept at http level
# so that other modules (Cloudflare) add their ranges instead of replacing these.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
