[program:laravel-worker]
; Rule: retry_after (config/queue.php, default 660) must stay greater than --timeout below (600).
; Otherwise a long job is released to a second worker while the first still runs, and it runs twice.
process_name=%(program_name)s_%(process_num)02d
command=php -d memory_limit=${APP_WORKERS_MEMORY_LIMIT} /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=600 --max-time=3600
autostart=true
autorestart=true
startsecs=5
startretries=30
stopasgroup=true
killasgroup=true
user=www-data
environment=HOME="/var/www" ; Supervisor keeps root's HOME after dropping to www-data — libpq would then fail reading /root/.postgresql.
numprocs=${APP_WORKERS_AMOUNT}
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker.log
stdout_logfile_maxbytes=0
stopwaitsecs=660
