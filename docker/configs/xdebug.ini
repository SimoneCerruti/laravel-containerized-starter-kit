; Dev-only Xdebug settings (web-local stage).
; Default mode is "off" so Xdebug adds no overhead to normal runs; PCOV handles
; coverage. Enable step debugging on demand via the XDEBUG_MODE env var
; (e.g. XDEBUG_MODE=debug) or per-request with the XDEBUG_TRIGGER cookie/var.
[xdebug]
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false
xdebug.log_level = 0
