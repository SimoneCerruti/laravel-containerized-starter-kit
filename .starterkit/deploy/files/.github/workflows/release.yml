name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = from Conventional Commits since the last tag)
        required: true
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/_finalize-release.yml
    with:
      source_branch: staging
      ff_branches: production
      bump: ${{ inputs.bump }}
    secrets: inherit
