name: Format

# Runs Pint with the repository's pint.json on every PR and pushes a `style:` commit with the fixes.
# Skipped for PRs from forks, where the workflow token cannot push to the head branch.
# A push made with GITHUB_TOKEN does not trigger other workflows: re-run them manually if needed.

on:
  pull_request:
    paths:
      - "**.php"
      - "pint.json"
  workflow_dispatch:

concurrency:
  group: format-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pint:
    name: Pint
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Run Pint
        run: ./vendor/bin/pint --parallel

      - name: Commit style fixes
        run: |
          if git diff --quiet; then
            echo "Nothing to fix."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply Pint formatting"
          git push
