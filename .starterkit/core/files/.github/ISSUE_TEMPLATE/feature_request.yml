name: ✨ Feature request
description: Propose a new feature or an improvement.
title: "[Feature]: "
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      description: What problem does this feature solve? For whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it should work. Include flows or screenshots if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: When do we consider this feature "done"?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
