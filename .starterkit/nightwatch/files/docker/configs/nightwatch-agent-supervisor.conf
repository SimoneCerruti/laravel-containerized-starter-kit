[program:nightwatch-agent]
command=php /var/www/html/artisan nightwatch:agent
autostart=true
autorestart=true
startsecs=5
startretries=30
stopasgroup=true
killasgroup=true
user=www-data
environment=HOME="/var/www" ; Supervisor keeps root's HOME after dropping to www-data.
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/nightwatch-agent.log
